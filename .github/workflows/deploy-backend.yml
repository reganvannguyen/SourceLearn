name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  EC2_INSTANCE_ID: i-0e7095a013cf335e7

jobs:
  test-and-deploy:
    name: Test and deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::396878495301:role/SourceLearnGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend through SSM
        id: deploy
        shell: bash
        run: |
          PARAMETERS=$(jq -nc \
            --arg c1 'set -e' \
            --arg c2 'sudo -u ubuntu -H bash -lc "cd /home/ubuntu/SourceLearn && git fetch origin aws-integration && git reset --hard origin/aws-integration"' \
            --arg c3 'cd /home/ubuntu/SourceLearn/backend && docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d' \
            --arg c4 'cd /home/ubuntu/SourceLearn/backend && docker compose -f docker-compose.yml -f docker-compose.prod.yml ps' \
            --arg c5 'for i in $(seq 1 12); do if curl -fsS http://localhost:8000/docs >/dev/null; then exit 0; fi; sleep 5; done; docker logs sourcelearn-backend --tail 100; exit 1' \
            '{commands:[$c1,$c2,$c3,$c4,$c5]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SourceLearn backend from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started SSM command: $COMMAND_ID"

      - name: Wait for backend deployment
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{stdout:StandardOutputContent,stderr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command."
          exit 1
