<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Open Book Base/Cover (Solid Black for crisp contrast on light & dark tabs) -->
  <path d="M 5 47 C 17 50, 26 48, 32 52 C 38 48, 47 50, 59 47 L 59 19 C 47 17, 38 19, 32 15 C 26 19, 17 17, 5 19 Z" fill="#111827"/>

  <!-- Left Page (White) -->
  <path d="M 32 18 C 26 15, 17 14, 7 17 L 7 44 C 17 42, 26 43, 32 46 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right Page (White) -->
  <path d="M 32 18 C 38 15, 47 14, 57 17 L 57 44 C 47 42, 38 43, 32 46 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Center Spine Fold -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Classic Notebook Red Margin Line (Left Page) -->
  <line x1="15" y1="17.5" x2="15" y2="42.5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ruled Notebook Page Lines (Left Page) -->
  <line x1="19" y1="24.5" x2="28" y2="25.5" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="31" x2="28" y2="32" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="37.5" x2="28" y2="38.5" stroke="#111827" stroke-width="2" stroke-linecap="round"/>

  <!-- Ruled Notebook Page Lines (Right Page) -->
  <line x1="36" y1="25.5" x2="52" y2="24" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="32" x2="52" y2="30.5" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="38.5" x2="52" y2="37" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
</svg>